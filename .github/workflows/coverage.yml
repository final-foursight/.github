name: Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # The reaper container exists to clean up leftover containers after a
      # crashed run; on a GitHub-hosted runner the whole VM is destroyed
      # after the job anyway, so it has nothing to do here.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync
      - run: uv run pytest test/unit test/integration --cov --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
