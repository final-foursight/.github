name: Docs

on:
  workflow_call:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync
      - run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
