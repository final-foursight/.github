name: Release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release semantic-release -c releaserc.json version --push --vcs-release
      - name: Comment on PRs included in this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          NEW_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null) || {
            echo "No release was created; skipping PR comments."
            exit 0
          }
          VERSION="${NEW_TAG#v}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${NEW_TAG}"

          PREV_TAG=$(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null) || true
          RANGE="${PREV_TAG:+$PREV_TAG..}$NEW_TAG"

          PR_NUMBERS=$(git log "$RANGE" --pretty=%s | grep -oE '\(#[0-9]+\)' | tr -d '()#' | sort -u)

          for PR in $PR_NUMBERS; do
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$(printf '🎉 This PR is included in version %s 🎉\n\nThe release is available on [GitHub release](%s)' "$VERSION" "$RELEASE_URL")"
          done
