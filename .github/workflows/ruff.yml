name: Ruff

on:
  workflow_call:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
